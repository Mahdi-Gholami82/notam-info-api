services:
    db:
        image: postgres:17
        ports:
            - 5432:5432
        volumes:
            - postgres-data:/var/lib/postgresql/data/
        secrets:
            - postgres_password
        environment:
            POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 10s
            timeout: 10s
            retries: 10   
            start_period: 30s   
        env_file:
            - .env.deploy   
    redis:
        image: redis:alpine
        container_name: redis-container
        expose:
            - 6379
        ports:
            - 6379:6379
        restart: unless-stopped
        volumes:
            - redis_data:/data
    django:
        image: registry:5000/mahdi/notaminfo:latest
        command: gunicorn app.config.wsgi:application --bind 0.0.0.0:8000
        ports:
            - 8000:8000
        depends_on:
            - db
            - redis
        environment:
            CELERY_BROKER_URL: redis://redis:6379/1
        env_file:
            - .env.deploy
        deploy:
            mode: global
            restart_policy:
                condition: on-failure
                delay: 15s
                max_attempts: 5
            rollback_config:
                parallelism: 1
                order: start-first
                failure_action: continue 

    celery:
        image: registry:5000/mahdi/notaminfo:latest
        container_name: celery-container
        command: uv run celery -A config worker --loglevel=info
        depends_on:
        - django
        - redis
        env_file:
            - .env.deploy
    beat:
        image: registry:5000/mahdi/notaminfo:latest
        container_name: beat-container
        command: uv run celery -A config beat --loglevel=info
        depends_on:
        - django
        - redis
        - celery
        env_file:
            - .env.deploy

    flower:
        image: registry:5000/mahdi/notaminfo:latest
        container_name: flower-container
        command: uv run celery -A config flower --port=5555
        ports: 
            - 5555:5555
        depends_on:
        - django
        - redis
        - celery
        env_file:
            - .env.deploy


volumes:
  postgres-data:
  redis_data:

secrets:
    postgres_password:
        file: postgres_password.txt
    django_secret_key:
        file: django_secret_key.txt